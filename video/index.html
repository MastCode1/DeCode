<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeCode — Motion</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Geist'; font-weight: 400; src: url(fonts/geist-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 500; src: url(fonts/geist-sans-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 600; src: url(fonts/geist-sans-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 700; src: url(fonts/geist-sans-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 400; src: url(fonts/geist-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 500; src: url(fonts/geist-mono-latin-500-normal.woff2) format('woff2'); }

:root {
  --bg: #07080b;
  --text: #f4f4f4;
  --muted: #8e8e8e;
  --line: #ffffff1f;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; overflow: hidden; }
body { font-family: 'Geist', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); transform-origin: 0 0; }
#dots { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: .78; image-rendering: pixelated; }
/* same vignette the decodeai.net hero lays over its dots */
#vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(#07080c38 0%, #07080c70 50%, #07080b 96%), linear-gradient(#07080b59, #0000 25%, #07080b26); }
#layer { position: absolute; inset: 0; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.scene { position: absolute; inset: 0; }

/* ---------- headline type-on ---------- */
.headline { position: absolute; inset: 0; letter-spacing: -0.03em; color: var(--text); white-space: nowrap; }
.headline__line { position: absolute; line-height: 1; }
.headline .hc { display: inline-block; will-change: opacity, filter; }
.hc.blue { color: #8fb0ff; }

/* ---------- picker ---------- */
.picker { position: absolute; width: 620px; background: #18191dF2; border: 1.5px solid #ffffff1c; border-radius: 28px; overflow: hidden;
  box-shadow: 0 30px 90px #000000b0, inset 0 1px #ffffff12; }
.picker__item { position: absolute; left: 12px; right: 12px; height: 88px; padding: 0 26px; display: flex; flex-direction: column; justify-content: center; border-radius: 18px; }
.picker__name { font-size: 27px; font-weight: 500; letter-spacing: -0.01em; display: flex; align-items: center; gap: 12px; }
.picker__desc { font-size: 20px; color: var(--muted); margin-top: 5px; }
.picker__hl { position: absolute; left: 12px; right: 12px; height: 88px; border-radius: 18px; background: #ffffff0d; }
.picker__check { position: absolute; right: 30px; top: 50%; width: 34px; height: 34px; margin-top: -17px; color: var(--text); }
.picker__logo { width: 36px; height: auto; display: block; }
.beta { font-size: 14px; font-weight: 600; color: #0d0d0d; background: #f4f4f4; border-radius: 999px; padding: 3px 10px; letter-spacing: .04em; }

/* ---------- pills ---------- */
.pill { position: absolute; left: 50%; display: inline-flex; align-items: center; gap: 14px; white-space: nowrap; border: 1.5px solid #ffffff1f; background: #0b0c10cc; border-radius: 999px; color: #c9d2e0; }
.pill--new { font-size: 26px; padding: 8px 26px 8px 8px; }
.pill--new b { font-weight: 500; color: #0d0d0d; background: #f4f4f4; border-radius: 999px; padding: 8px 20px; }
.pill--dev { font-size: 30px; padding: 16px 34px; }
.pill__dot { width: 14px; height: 14px; border-radius: 50%; background: #3b82f6; box-shadow: 0 0 0 0 #3b82f680; }

/* ---------- composer (DeCode prompt box) ---------- */
.composer { position: absolute; height: 104px; background: #1e1f23d9; border: 1.5px solid #ffffff21; border-radius: 52px;
  box-shadow: 0 22px 70px #0000005c, inset 0 1px #ffffff14; }
.composer__text, .composer__placeholder { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); font-size: 30px; line-height: 48px; white-space: nowrap; letter-spacing: -0.005em; }
.composer__placeholder { color: #a6a6a6; }
.composer__caret { display: inline-block; width: 3px; height: 36px; background: #f4f4f4; vertical-align: -7px; margin-left: 2px; border-radius: 2px; }
.composer--expanded .composer__text { left: 44px; top: 30px; transform: none; white-space: normal; }
.composer__icon { width: 52px; height: 52px; display: grid; place-items: center; color: #d0d0d0; }
.composer__icon svg { width: 34px; height: 34px; }
.composer__mic svg { width: 30px; height: 30px; }
.composer__plus { position: absolute; left: 26px; top: 50%; margin-top: -26px; }
.composer--expanded .composer__plus { top: auto; bottom: 18px; margin-top: 0; }
.composer__right { position: absolute; right: 20px; top: 50%; margin-top: -32px; height: 64px; display: flex; align-items: center; gap: 8px; }
.composer--expanded .composer__right { top: auto; bottom: 14px; margin-top: 0; }
.composer__model { font-size: 25px; color: #d0d0d0; display: flex; align-items: center; gap: 4px; padding: 0 10px; }
.composer__chev svg { width: 22px; height: 22px; display: block; opacity: .7; }
.composer__btn { position: relative; width: 64px; height: 64px; border-radius: 50%; background: #f4f4f4; color: #0d0d0d; }
.composer__btn-icon { position: absolute; inset: 0; display: grid; place-items: center; }
.composer__btn-icon svg { width: 32px; height: 32px; }

/* ---------- status ticker ---------- */
.ticker { position: absolute; left: 0; width: 1920px; height: 120px;
  -webkit-mask-image: linear-gradient(90deg, transparent 23%, #000 36%, #000 64%, transparent 77%);
          mask-image: linear-gradient(90deg, transparent 23%, #000 36%, #000 64%, transparent 77%); }
.ticker__label { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; font-weight: 500; letter-spacing: -0.02em; line-height: 1.4; }
.shimmer { background: linear-gradient(90deg, #5e5e5e 0%, #5e5e5e 38%, #f2f2f2 50%, #5e5e5e 62%, #5e5e5e 100%); background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- chat ---------- */
.chat { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.capsule-row { display: flex; justify-content: flex-end; margin-bottom: 46px; }
.capsule { color: #f6f4ef; background: #3a3a3abd; border-radius: 30px; padding: 22px 34px; font-size: 25px; line-height: 1.6; max-width: 820px; }
.capsule--one { border-radius: 999px; }
.msg { font-size: 25px; line-height: 1.68; color: var(--text); }
.msg p { margin: 0 0 22px; }
.msg strong { font-weight: 600; }
.msg .formula { font-family: 'Geist Mono', monospace; font-size: 23px; background: #ffffff0a; border: 1px solid #ffffff12; border-radius: 14px; padding: 14px 22px; display: inline-block; margin: 0 0 22px; }
.msg table { border-collapse: separate; border-spacing: 0; border: 1.5px solid #ffffff17; border-radius: 18px; width: 100%; margin: 0 0 24px; overflow: hidden; }
.msg th, .msg td { text-align: left; padding: 13px 24px; font-size: 22.5px; border-bottom: 1.5px solid #ffffff0f; font-variant-numeric: tabular-nums; }
.msg th { background: #ffffff09; font-size: 21px; font-weight: 600; color: #d8d8d8; }
.msg tr:last-child td { border-bottom: 0; }
.msg tr.hl td { background: #3b82f62e; color: #fff; }
.think { display: inline-flex; align-items: center; gap: 12px; font-size: 23px; font-weight: 500; color: #eeeef4e0; margin-bottom: 18px; }
.think svg { width: 25px; height: 25px; color: #9a9a9a; }
.think .chev { width: 22px; height: 22px; opacity: .6; }
.status-inline { font-size: 32px; font-weight: 500; display: inline-block; white-space: nowrap; }
.status-inline .shimmer { background-image: linear-gradient(90deg, #7a7a7a 0%, #7a7a7a 38%, #ffffff 50%, #7a7a7a 62%, #7a7a7a 100%); }

/* ---------- code block (mirrors DeCode's .cb component) ---------- */
.cb { background: #202020; border: 1.5px solid #ffffff14; border-radius: 22px; overflow: hidden; box-shadow: 0 4px 18px #0000003d; margin: 4px 0 0; }
.cb__toolbar { background: #050505; border-bottom: 1.5px solid #ffffff14; display: flex; justify-content: space-between; align-items: center; min-height: 76px; padding: 8px 14px 8px 26px; }
.cb__identity { color: #f2f2f2; font-size: 21px; font-weight: 600; display: inline-flex; align-items: center; gap: 12px; }
.cb__identity svg { width: 26px; height: 26px; color: #bdbdbd; }
.cb__actions { display: flex; align-items: center; gap: 10px; }
.cb__mode { position: relative; display: inline-flex; gap: 3px; height: 60px; padding: 3px; border-radius: 999px; background: #080808bd; box-shadow: inset 0 0 0 1.5px #ffffff0b; }
.cb__mode-hl { position: absolute; top: 3px; left: 3px; width: 54px; height: 54px; border-radius: 50%; background: #ffffff1c; }
.cb__btn { position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #e5e5e5; }
.cb__btn svg { width: 26px; height: 26px; }
.cb__pre { margin: 0; padding: 14px 34px 30px; font-family: 'Geist Mono', monospace; font-size: 21px; line-height: 1.62; color: #abb2bf; white-space: pre; tab-size: 2; }
.cb__pre .cl { display: block; min-height: 1.62em; }
.cb__preview { display: none; width: 100%; height: 620px; border: 0; background: #fff; }
.cb--preview { background: #000; }

/* one-dark-ish token colors */
.token.comment, .token.prolog, .token.doctype, .token.cdata { color: #7f848e; }
.token.punctuation { color: #abb2bf; }
.token.tag, .token.selector .token.class, .token.property, .token.deleted { color: #e06c75; }
.token.attr-name, .token.number, .token.boolean, .token.constant { color: #d19a66; }
.token.string, .token.attr-value, .token.char, .token.inserted { color: #98c379; }
.token.selector { color: #e5c07b; }
.token.operator, .token.entity, .token.url { color: #56b6c2; }
.token.keyword, .token.atrule, .token.important { color: #c678dd; }
.token.function { color: #61afef; }
.token.class-name { color: #e5c07b; }
.token.attr-value > .token.punctuation { color: #98c379; }
.token.tag > .token.punctuation { color: #abb2bf; }

/* ---------- montage cards ---------- */
.mcard { position: absolute; left: 50%; top: 50%; width: 1440px; margin-left: -720px; }
.mcard .cb { margin: 0; box-shadow: 0 40px 120px #000000c0; }
.mcard .cb__preview { display: block; height: 780px; }
.mcard__cap { text-align: center; font-size: 26px; color: #9da8ba; margin-top: 26px; }

/* ---------- generated image ---------- */
.gen-image { width: 840px; height: 560px; border-radius: 26px; overflow: hidden; margin: 0 0 26px; background: #15161a; position: relative; }
.gen-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- cursor ---------- */
.cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 50; filter: drop-shadow(0 4px 10px #0009); }
.cursor svg { width: 100%; height: 100%; }
.cursor__ring { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #8fb0ff; z-index: 49; }

/* ---------- end ---------- */
.logo { position: absolute; left: 50%; top: 50%; width: 300px; margin-left: -150px; margin-top: -102px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="dots" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div id="layer"></div>
  <div id="fade"></div>
</div>
<script src="vendor/prism.min.js"></script>
<script type="module">
import { boot } from './src/timeline.js';
boot().catch(e => { window.__error = String(e && e.stack || e); console.error(e); });
</script>
</body>
</html>
