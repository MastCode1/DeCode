<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeCode Launch Film</title>
<style>
@font-face { font-family: Geist; src: url(fonts/geist-sans-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: Geist; src: url(fonts/geist-sans-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Geist; src: url(fonts/geist-sans-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: Geist; src: url(fonts/geist-sans-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
@font-face { font-family: 'Geist Mono'; src: url(fonts/geist-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'Geist Mono'; src: url(fonts/geist-mono-latin-500-normal.woff2) format('woff2'); font-weight: 500; }

:root {
  --bg: #07080b;
  --ink: #f4f5f8;
  --ink2: #c8cbd5;
  --mute: #868a96;
  --line: rgba(255, 255, 255, .08);
  --card: #121318;
  --field: #18191e;
  --accent: #93b2ff;
  --accent2: #b6a6ff;
}
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--bg); color: var(--ink); transform-origin: 0 0;
  font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
}
#stage canvas { position: absolute; left: 0; top: 0; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.scene { position: absolute; inset: 0; transform-origin: 50% 50%; display: none; }
.abs { position: absolute; }
.w { display: inline-block; white-space: pre; }
.grad {
  background: linear-gradient(100deg, #ffffff 0%, #dfe6ff 35%, var(--accent) 70%, var(--accent2) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.accent { color: var(--accent); }

/* Headlines */
.headline {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  text-align: center; font-size: 86px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.14;
}
.headline .line { white-space: nowrap; }

/* Cards */
.card {
  position: absolute; box-sizing: border-box;
  background: linear-gradient(180deg, #15161c 0%, #101115 100%);
  border: 1px solid rgba(255, 255, 255, .075); border-radius: 28px;
  box-shadow: 0 40px 120px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05);
}

/* Picker */
.picker { left: 50%; width: 640px; margin-left: -320px; overflow: hidden; }
.prow {
  position: absolute; left: 10px; right: 10px; height: 84px; display: flex; align-items: center; gap: 20px;
  padding: 0 22px; box-sizing: border-box; border-radius: 18px;
}
.ptile {
  width: 48px; height: 48px; border-radius: 14px; background: #1e2028; display: grid; place-items: center;
  color: #c9ccd6; flex: none; border: 1px solid rgba(255, 255, 255, .05);
}
.ptile svg { width: 24px; height: 24px; }
.ptitle { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
.psub { font-size: 19px; color: var(--mute); margin-top: 2px; }
.phover { position: absolute; left: 10px; right: 10px; height: 84px; border-radius: 18px; background: rgba(255, 255, 255, .055); }
.pcheck { margin-left: auto; width: 30px; height: 30px; color: var(--accent); }

/* Composer */
.composer {
  position: absolute; box-sizing: border-box; background: var(--field);
  border: 1px solid rgba(255, 255, 255, .07); box-shadow: 0 30px 90px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .04);
  overflow: hidden;
}
.cp-in { position: absolute; left: 0; top: 0; width: 1080px; height: 92px; display: flex; align-items: center; gap: 20px; padding: 0 16px 0 30px; box-sizing: border-box; }
.cp-icon { width: 30px; height: 30px; color: #c9ccd6; flex: none; }
.cp-text { flex: 1; font-size: 29px; color: #eceef3; white-space: nowrap; overflow: hidden; position: relative; height: 40px; line-height: 40px; letter-spacing: -0.005em; }
.cp-ph { position: absolute; left: 0; top: 0; color: #7b7e89; }
.caret { display: inline-block; width: 2.5px; height: 33px; background: #e9ebf2; vertical-align: -7px; margin-left: 2px; border-radius: 2px; }
.cp-send { width: 60px; height: 60px; border-radius: 50%; background: #f7f7f7; position: relative; flex: none; color: #0b0c10; }
.cp-send svg { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; }

/* Chat */
.bubble {
  position: absolute; right: 380px; max-width: 1000px; box-sizing: border-box; padding: 20px 28px;
  border-radius: 30px; background: #1c1e25; font-size: 27px; line-height: 1.45; color: #eceef3; border: 1px solid rgba(255,255,255,.05);
}
.resp { position: absolute; left: 380px; width: 1160px; font-size: 31px; line-height: 1.5; color: var(--ink2); letter-spacing: -0.005em; }
.resp b { color: var(--ink); font-weight: 600; }
.thinking { position: absolute; left: 0; right: 0; top: 50%; height: 80px; margin-top: -40px; }
.think-ph {
  position: absolute; left: 0; right: 0; text-align: center; font-size: 62px; font-weight: 500; letter-spacing: -0.03em;
  background: linear-gradient(100deg, #565a66 0%, #565a66 38%, #f3f5ff 50%, #565a66 62%, #565a66 100%);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* Gantt */
.gantt { left: 380px; top: 400px; width: 1160px; height: 520px; }
.g-title { position: absolute; left: 44px; top: 36px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 14px; }
.chip { display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 16px; border-radius: 19px; background: #1d1f27; color: var(--ink2); font-size: 19px; font-weight: 500; border: 1px solid rgba(255,255,255,.06); white-space: nowrap; }
.g-week { position: absolute; top: 110px; font-size: 19px; color: var(--mute); font-weight: 500; }
.g-vline { position: absolute; top: 148px; bottom: 30px; width: 0; border-left: 1px dashed rgba(255, 255, 255, .09); }
.g-label { position: absolute; left: 44px; font-size: 24px; font-weight: 500; color: var(--ink2); height: 52px; line-height: 52px; }
.g-bar { position: absolute; height: 52px; border-radius: 15px; overflow: hidden; }
.g-bar span { position: absolute; left: 20px; top: 0; line-height: 52px; font-size: 20px; font-weight: 600; color: #0b0d14; white-space: nowrap; }
.g-mile { position: absolute; width: 30px; height: 30px; background: #fff; transform: rotate(45deg); border-radius: 5px; box-shadow: 0 0 30px rgba(147,178,255,.9); }
.g-milelabel { position: absolute; font-size: 22px; font-weight: 600; color: #fff; white-space: nowrap; }
.g-ring { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); }

/* Code */
.ed-head { position: absolute; left: 0; right: 0; top: 0; height: 60px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; padding: 0 24px; gap: 14px; box-sizing: border-box; }
.ed-tab { display: flex; align-items: center; gap: 10px; font-size: 19px; color: var(--ink); font-family: 'Geist Mono', monospace; background: #1b1d24; height: 38px; padding: 0 16px; border-radius: 10px; }
.ed-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.ed-status { margin-left: auto; font-size: 19px; color: var(--mute); display: flex; align-items: center; gap: 10px; }
.ed-body { position: absolute; left: 0; right: 0; top: 60px; bottom: 0; padding-top: 24px; font-family: 'Geist Mono', monospace; font-size: 22.5px; line-height: 35px; }
.ed-line { position: relative; height: 35px; white-space: pre; }
.ed-ln { position: absolute; left: 0; width: 66px; text-align: right; color: #4c505b; }
.ed-code { position: absolute; left: 96px; color: #e6e7ec; }
.ed-hl { position: absolute; left: 0; right: 0; height: 35px; background: rgba(147, 178, 255, .08); border-left: 3px solid var(--accent); box-sizing: border-box; }
.t-kw { color: #c3a6ff; } .t-fn { color: #93b2ff; } .t-str { color: #a9e5b8; } .t-tag { color: #7fd1ff; }
.t-attr { color: #f5c38b; } .t-p { color: #8b8f9b; } .t-num { color: #f5a3a3; }

/* Browser preview */
.browser { overflow: hidden; background: #f5f4f0; border: 1px solid rgba(255,255,255,.12); }
.br-bar { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: #e9e8e3; display: flex; align-items: center; padding: 0 20px; gap: 9px; box-sizing: border-box; }
.br-bar i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.br-url { position: absolute; left: 50%; width: 340px; margin-left: -170px; height: 34px; border-radius: 17px; background: #f7f6f2; color: #6f6d68; font-size: 17px; text-align: center; line-height: 34px; }
.op { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; color: #15161a; }
.op-nav { position: absolute; left: 40px; right: 40px; top: 28px; display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.op-nav .r { margin-left: auto; font-size: 18px; font-weight: 500; color: #6b6a66; }
.op-h1 { position: absolute; left: 0; right: 0; top: 214px; text-align: center; font-size: 64px; font-weight: 600; letter-spacing: -0.04em; }
.op-p { position: absolute; left: 0; right: 0; top: 304px; text-align: center; font-size: 24px; color: #6b6a66; }
.op-form { position: absolute; left: 50%; top: 380px; width: 720px; margin-left: -360px; display: flex; gap: 14px; }
.op-input { flex: 1; height: 64px; border-radius: 32px; background: #fff; border: 1.5px solid #d9d7d0; box-sizing: border-box; padding: 0 26px; font-size: 22px; line-height: 61px; color: #15161a; white-space: nowrap; overflow: hidden; }
.op-input { position: relative; }
.op-input .ph { color: #a3a19b; position: absolute; left: 26px; top: 0; }
.op-btn { position: relative; width: 268px; height: 64px; border-radius: 32px; background: #15161a; color: #fff; font-size: 21px; font-weight: 600; overflow: hidden; }
.op-btn span { position: absolute; left: 0; right: 0; top: 0; line-height: 64px; text-align: center; white-space: nowrap; }
.op-note { position: absolute; left: 0; right: 0; top: 476px; text-align: center; font-size: 18px; color: #8d8b85; }
.cursor { position: absolute; width: 38px; height: 38px; left: 0; top: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }

/* Research */
.src-chip { position: absolute; height: 46px; padding: 0 18px 0 12px; border-radius: 23px; background: #1a1c23; border: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; gap: 10px; font-size: 19px; color: var(--ink2); white-space: nowrap; font-weight: 500; }
.src-chip i { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 700; color: #0b0d14; }
.tile { top: 370px; width: 373px; height: 330px; }
.tile .big { position: absolute; left: 36px; top: 34px; font-size: 64px; font-weight: 600; letter-spacing: -0.04em; color: #fff; }
.tile .lab { position: absolute; left: 36px; top: 120px; font-size: 22px; color: var(--mute); }
.hist { position: absolute; left: 36px; right: 36px; bottom: 36px; height: 110px; display: flex; align-items: flex-end; gap: 12px; }
.hist div { flex: 1; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, var(--accent), rgba(147,178,255,.25)); }
.hist div.on { background: linear-gradient(180deg, #fff, var(--accent)); }

/* Doc */
.doc { left: 360px; top: 110px; width: 1200px; height: 820px; }
.doc-head { position: absolute; left: 0; right: 0; top: 0; height: 66px; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 14px; padding: 0 30px; box-sizing: border-box; font-size: 20px; color: var(--ink2); }
.doc-head svg { width: 24px; height: 24px; color: var(--accent); }
.doc-head .r { margin-left: auto; color: var(--mute); font-size: 18px; }
.doc-body { position: absolute; left: 100px; top: 130px; width: 1000px; }
.doc-title { font-size: 60px; font-weight: 600; letter-spacing: -0.035em; height: 76px; color: #fff; }
.doc-text { margin-top: 30px; font-size: 32px; line-height: 1.62; color: #d4d7df; letter-spacing: -0.005em; position: relative; }
.doc-text p { margin: 0 0 22px; }
.sel { background-image: linear-gradient(rgba(147, 178, 255, .32), rgba(147, 178, 255, .32)); background-repeat: no-repeat; background-size: 0% 100%; border-radius: 4px; }
.ask { position: absolute; height: 52px; padding: 0 22px 0 16px; border-radius: 26px; background: #f4f5f8; color: #0c0d12; font-size: 21px; font-weight: 600; display: flex; align-items: center; gap: 10px; white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
.ask svg { width: 22px; height: 22px; }
.mini { position: absolute; left: 100px; right: 100px; bottom: 60px; height: 150px; border-radius: 28px; background: #1a1c22; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.mini-q { position: absolute; left: 30px; right: 30px; top: 22px; font-size: 20px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 12px; align-items: center; }
.mini-q b { width: 3px; height: 26px; background: var(--accent); border-radius: 2px; flex: none; }
.mini-in { position: absolute; left: 30px; right: 100px; bottom: 26px; font-size: 27px; color: #eceef3; height: 40px; line-height: 40px; white-space: nowrap; }
.mini .cp-send { position: absolute; right: 18px; bottom: 16px; width: 56px; height: 56px; }

/* Voice */
.badge { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 22px 0 8px; border-radius: 27px; border: 1px solid rgba(255,255,255,.1); background: rgba(16,17,22,.8); font-size: 22px; color: var(--ink2); white-space: nowrap; }
.badge b { background: #f4f5f8; color: #0c0d12; border-radius: 19px; height: 38px; line-height: 38px; padding: 0 16px; font-weight: 600; font-size: 19px; }
.cap { position: absolute; left: 0; right: 0; text-align: center; }
.cap .who { font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 600; margin-bottom: 14px; }
.cap .say { font-size: 46px; font-weight: 500; letter-spacing: -0.03em; }
.notif { left: 50%; width: 700px; margin-left: -350px; top: 850px; height: 112px; border-radius: 30px; display: flex; align-items: center; gap: 22px; padding: 0 30px; }
.notif .ic { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: #0b0d14; display: grid; place-items: center; flex: none; }
.notif .ic svg { width: 32px; height: 32px; }
.notif .t1 { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; }
.notif .t2 { font-size: 20px; color: var(--mute); margin-top: 4px; }

/* Outro */
.wordmark { position: absolute; left: 0; right: 0; top: 50%; margin-top: -80px; height: 160px; line-height: 160px; text-align: center; font-size: 150px; font-weight: 600; letter-spacing: -0.05em; white-space: pre; }

/* Preview controls (hidden in render mode) */
#ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: rgba(0,0,0,.75); color: #ddd; font: 13px system-ui, sans-serif; z-index: 10; }
#ui input[type=range] { flex: 1; }
#ui button { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="scenes"></div>
  <canvas id="top" width="1920" height="1080"></canvas>
  <div id="fade"></div>
</div>
<div id="ui"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.00s</span></div>
<script src="assets/logo-points.js"></script>
<script>
'use strict';
/* =========================================================================
   DeCode launch film: a deterministic motion-graphics composition.
   Every frame is a pure function of time t (seconds): window.seek(t).
   No animation libraries or plugins; just DOM, CSS and canvas.
   ========================================================================= */
const W = 1920, H = 1080, FPS = 60;
const RENDER = /[?&]render/.test(location.search);
if (RENDER) document.body.classList.add('render');

/* ---------- math helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spring: x => x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(9.5 * x),
};
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(i, j) { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
const fbm = (x, y) => noise(x, y) * .65 + noise(x * 2.03 + 17.1, y * 2.03 - 9.4) * .35;

/* ---------- sound cues: scenes report key moments; render.mjs --cues collects them ---------- */
const CUES = {};
const cue = (name, t) => { CUES[name] = +t.toFixed(4); };
const TYPED = [], CODE_EL = [];

/* ---------- DOM helpers ---------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), scenesEl = $('scenes');
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function setStyle(e, o) { for (const k in o) e.style[k] = o[k]; }
function fadeBlur(e, v, rise = 0, blur = 12, scale = null) {
  e.style.opacity = v;
  const tr = [];
  if (rise) tr.push(`translateY(${rise}px)`);
  if (scale != null) tr.push(`scale(${scale})`);
  e.style.transform = tr.join(' ');
  e.style.filter = v < .998 ? `blur(${((1 - v) * blur).toFixed(2)}px)` : 'none';
}
/* inOut envelope: rises over [a, a+ia], falls over [b, b+ob] */
const env = (t, a, ia, b, ob, ein = E.outCubic, eout = E.inCubic) => ein(p(t, a, ia)) * (1 - eout(p(t, b, ob)));

const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>',
  wave: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4.6" y="8.5" width="2.6" height="7" rx="1.3"/><rect x="8.9" y="5" width="2.6" height="14" rx="1.3"/><rect x="13.2" y="5" width="2.6" height="14" rx="1.3"/><rect x="17.5" y="8.5" width="2.6" height="7" rx="1.3"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="ck" d="M20 6 9 17l-5-5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/></svg>',

/* ---------- words / typing ---------- */
/* text supports *accent* segments, rendered with the brand gradient */
function makeWords(parent, text) {
  const spans = [];
  const parts = text.split(' ');
  parts.forEach((wd, i) => {
    const s = el('span', 'w', parent);
    if (/^\*.*\*[.,]?$/.test(wd)) { const m = wd.match(/^\*(.*)\*([.,]?)$/); s.classList.add('grad'); s.textContent = m[1] + m[2]; }
    else s.textContent = wd;
    spans.push(s);
    if (i < parts.length - 1) parent.appendChild(document.createTextNode(' '));
  });
  return spans;
}
function animWords(spans, lt, inAt, stagger, dur, outAt, outDur, rise = 30, blur = 14) {
  spans.forEach((s, i) => {
    const a = E.outCubic(p(lt, inAt + i * stagger, dur));
    const b = outAt == null ? 0 : E.inCubic(p(lt, outAt + i * .03, outDur));
    const v = a * (1 - b);
    s.style.opacity = v.toFixed(4);
    s.style.transform = `translateY(${((1 - a) * rise - b * rise * .7).toFixed(2)}px)`;
    s.style.filter = v < .998 ? `blur(${((1 - v) * blur).toFixed(2)}px)` : 'none';
  });
}
/* human-ish typing: deterministic per-character timings */
const typeCache = new Map();
function typedCount(text, lt, start, cps) {
  const key = text + '|' + cps;
  let ts = typeCache.get(key);
  if (!ts) {
    const r = rng(text.length * 7919 + cps * 31);
    ts = []; let acc = 0;
    for (let i = 0; i < text.length; i++) {
      let d = (1 / cps) * (0.55 + r() * 0.9);
      if (text[i - 1] === ' ') d *= 1.25;
      if (/[,.?]/.test(text[i - 1] || '')) d *= 2.2;
      acc += d; ts.push(acc);
    }
    typeCache.set(key, ts);
  }
  const t = lt - start;
  let n = 0; while (n < ts.length && ts[n] <= t) n++;
  return n;
}
const typeDur = (text, cps) => { typedCount(text, 0, 0, cps); return typeCache.get(text + '|' + cps).at(-1); };

/* ---------- background: the dithered dot field from decodeai.net ---------- */
const bgc = $('bg'), bx = bgc.getContext('2d');
const fxc = $('fx'), fx = fxc.getContext('2d');
const topc = $('top'), tx = topc.getContext('2d');
const SP = 10, DS = 3.2;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const UI_SCENES = ['think', 'code', 'research', 'write'];
function bgLevel(t) {
  let ui = 0;
  for (const n of UI_SCENES) { const [a, b] = TL[n]; ui = Math.max(ui, smooth(a - .2, a + .6, t) * (1 - smooth(b - .8, b, t))); }
  const intro = smooth(0, 1.2, t);
  return intro * (1 - .6 * ui);
}
function drawBg(t) {
  bx.fillStyle = '#07080b'; bx.fillRect(0, 0, W, H);
  const lv = bgLevel(t);
  if (lv < .01) return;
  bx.fillStyle = 'rgb(44, 86, 166)';
  const cols = W / SP, rows = H / SP;
  const lx = 330 + Math.sin(t * .11) * 70, ly = 600 + Math.cos(t * .09) * 50;
  const rx = 1600 + Math.cos(t * .1) * 60, ry = 440 + Math.sin(t * .13) * 60;
  for (let j = 0; j < rows; j++) {
    const y = j * SP + 3;
    for (let i = 0; i < cols; i++) {
      const x = i * SP + 3;
      const dl = ((x - lx) ** 2) / (720 ** 2) + ((y - ly) ** 2) / (600 ** 2);
      const dr = ((x - rx) ** 2) / (680 ** 2) + ((y - ry) ** 2) / (560 ** 2);
      let m = Math.max(1 - dl, 1 - dr, .16);
      const n = fbm(x * .0042 + t * .05, y * .0042 - t * .032);
      const f = m * (.25 + .9 * n) * lv;
      const th = BAYER[(j & 3) * 4 + (i & 3)];
      const a = smooth(th - .07, th + .07, f);
      if (a < .02) continue;
      bx.globalAlpha = a * .85;
      bx.fillRect(x, y, DS, DS);
    }
  }
  bx.globalAlpha = 1;
  // soft vignette keeps edges calm
  const g = bx.createRadialGradient(960, 540, 300, 960, 540, 1150);
  g.addColorStop(0, 'rgba(7,8,11,0)'); g.addColorStop(1, 'rgba(7,8,11,.82)');
  bx.fillStyle = g; bx.fillRect(0, 0, W, H);
}

/* ---------- scene registry ---------- */
const SCENES = [];
function addScene(name, build, update, opts = {}) {
  const [s, e] = TL[name];

}
function seek(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  drawBg(t);
  fx.clearRect(0, 0, W, H);
  tx.clearRect(0, 0, W, H);
  for (const sc of SCENES) {
    const on = t >= sc.s && t < sc.e;
    if (on !== sc.on) { sc.root.style.display = on ? 'block' : 'none'; sc.on = on; }
    if (!on) continue;
    const lt = t - sc.s;
    sc.root.style.transform = `scale(${(1 + sc.push * lt / sc.ctx.dur).toFixed(5)})`;
    sc.update(lt, sc.ctx, t);

}

function makeComposer(parent) {

  return { c, inn, ph, typed, caret, send, wave, up };
}
/* standard composer behaviour: appear, type, send. Returns sendAt. */
function runComposer(cp, lt, text, o) {
  const { inAt = 0, typeAt = .7, cps = 23, outAt } = o;
  const n = typedCount(text, lt, typeAt, cps);
  const sendAt = typeAt + typeDur(text, cps) + .3;
  cp.typed.textContent = text.slice(0, n);
  cp.ph.style.opacity = n ? 0 : 1;
  const typing = lt >= typeAt && n < text.length;
  cp.caret.style.opacity = lt > sendAt ? 0 : (typing || Math.floor(lt * 2.2) % 2 === 0) ? 1 : 0;
  const hasText = clamp(n);
  cp.wave.style.opacity = 1 - hasText; cp.up.style.opacity = hasText;
  const press = lt > sendAt ? Math.sin(Math.PI * p(lt, sendAt, .22)) : 0;
  cp.send.style.transform = `scale(${1 - press * .16})`;
  cp.send.style.background = press > 0 ? `rgb(${247 - press * 100},${247 - press * 70},255)` : '#f7f7f7';
  const a = E.outQuint(p(lt, inAt, .6));
  const b = outAt != null ? E.inOutCubic(p(lt, outAt, .5)) : 0;
  const v = a * (1 - b);
  setStyle(cp.c, { left: '420px', top: '494px', width: '1080px', height: '92px', borderRadius: '46px' });
  cp.c.style.opacity = v;
  cp.c.style.transform = `translateY(${(1 - a) * 40 - b * 60}px) scale(${lerp(.96, 1, a) - b * .04})`;
  cp.c.style.filter = v < .998 ? `blur(${(1 - v) * 10}px)` : 'none';
  return sendAt;
}
function makeThinking(parent, phrases) {
  const wrap = el('div', 'thinking', parent);
  const items = phrases.map(ph => el('div', 'think-ph', wrap, ph));
  return { wrap, items };
}
/* shimmer + left-to-right wipe between phrases (as in the reference) */
function runThinking(th, lt, start, step) {
  const sweep = ((lt * .75) % 1);
  th.items.forEach((it, i) => {
    const a = start + i * step, b = a + step;
    const rev = E.inOutSine(p(lt, a, .55)) * 125;
    const hide = i === th.items.length - 1 ? E.inOutSine(p(lt, b - .3, .5)) * 125 : E.inOutSine(p(lt, b, .55)) * 125;
    if (lt < a || hide >= 124) { it.style.opacity = 0; return; }
    it.style.opacity = 1;
    const m = hide > 0
      ? `linear-gradient(90deg, transparent ${hide - 25}%, #000 ${hide}%)`
      : `linear-gradient(90deg, #000 ${rev - 25}%, transparent ${rev}%)`;
    it.style.webkitMaskImage = m; it.style.maskImage = m;
    it.style.backgroundPosition = `${lerp(130, -30, sweep)}% 0`;
  });
}

  const s0 = t - lt; cue('select', s0 + selAt); cue('click3', s0 + 4.5); cue('send4', s0 + sAt); cue('rewrite', s0 + rwAt + .5);
}, { push: .014 });

/* =========================================================================
   VOICE: a living dot sphere; "Let's launch Orbit."
   ========================================================================= */
const ORB = (() => {
  const N = 1500, pts = [], ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) { const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = ga * i; pts.push([Math.cos(th) * r, y, Math.sin(th) * r]); }
  return pts;
})();
function drawOrb(ctx2, cx, cy, R, t, amp, speak, alpha) {
  const ay = t * .45, ax = .35 + Math.sin(t * .6) * .12;
  const cyA = Math.cos(ay), syA = Math.sin(ay), cxA = Math.cos(ax), sxA = Math.sin(ax);
  // glow
  const g = ctx2.createRadialGradient(cx, cy, R * .2, cx, cy, R * 1.9);
  g.addColorStop(0, `rgba(147,178,255,${.22 * alpha * (0.6 + amp * .6)})`); g.addColorStop(1, 'rgba(147,178,255,0)');
  ctx2.fillStyle = g; ctx2.fillRect(cx - R * 2, cy - R * 2, R * 4, R * 4);
  const cr = Math.round(lerp(147, 236, speak)), cg = Math.round(lerp(178, 228, speak)), cb = 255;
  ctx2.fillStyle = `rgb(${cr},${cg},${cb})`;
  for (const [x0, y0, z0] of ORB) {
    let x = x0 * cyA + z0 * syA, z = -x0 * syA + z0 * cyA;
    let y = y0 * cxA - z * sxA; z = y0 * sxA + z * cxA;
    const n = noise(x0 * 3 + t * 1.4, y0 * 3 + z0 * 2.1 - t);
    const d = (1 + .05 * amp) * (1 + amp * (n - .5) * .16);
    const px = cx + x * R * d, py = cy + y * R * d;
    const depth = (z + 1) / 2;
    const s = 1.6 + depth * 3.4;
    ctx2.globalAlpha = alpha * (.18 + .82 * depth * depth);
    ctx2.fillRect(px - s / 2, py - s / 2, s, s);
  }
  ctx2.globalAlpha = 1;
}
const SAY_USER = 'Okay DeCode, let\'s launch Orbit.';
const SAY_BOT = 'Done. Orbit is live.';
addScene('voice', ctx => {
  ctx.badge = el('div', 'badge', ctx.root, '<b>New</b>Real-time voice is available in DeCode.');
  ctx.c1 = el('div', 'cap', ctx.root); ctx.c1.style.top = '715px';
  el('div', 'who', ctx.c1, 'You');
  ctx.w1 = makeWords(el('div', 'say', ctx.c1), SAY_USER);
  ctx.c2 = el('div', 'cap', ctx.root); ctx.c2.style.top = '715px';
  el('div', 'who', ctx.c2, 'DeCode').style.color = 'var(--accent)';
  ctx.w2 = makeWords(el('div', 'say', ctx.c2), SAY_BOT);
  ctx.notif = el('div', 'card notif', ctx.root, `<div class="ic">${ICON.check}</div><div><div class="t1">Orbit is live</div><div class="t2">1,284 people on the waitlist were notified</div></div>`);
}, (lt, ctx, t) => {
  const o = E.inCubic(p(lt, ctx.dur - .55, .5));
  const a = E.outQuint(p(lt, 0, .9));
  const ub = env(lt, .8, .2, 2.2, .3, E.outCubic, E.inOutCubic), bb = env(lt, 2.75, .2, 3.6, .3, E.outCubic, E.inOutCubic);
  const syll = .55 + .45 * Math.abs(Math.sin(lt * 11.5) * Math.sin(lt * 4.3 + 1));
  const amp = .25 + 1.6 * Math.max(ub, bb) * syll;
  const speak = E.inOutCubic(p(lt, 2.55, .4)) * (1 - E.inOutCubic(p(lt, 4.0, .6)));
  drawOrb(fx, 960, 430, lerp(120, 210, a) * (1 + .02 * Math.sin(lt * 2)), t, amp * (1 - o), speak, a * (1 - o));
  const bd = E.outCubic(p(lt, .1, .6));
  fadeBlur(ctx.badge, bd * (1 - o), 0, 8);
  ctx.badge.style.transform = `translateX(-50%) translateY(${(1 - bd) * -20}px)`;
  const c1o = E.inCubic(p(lt, 2.35, .35));
  ctx.c1.style.opacity = 1 - c1o; ctx.c1.style.filter = c1o > 0 ? `blur(${c1o * 10}px)` : 'none';
  ctx.c1.style.transform = `translateY(${-c1o * 24}px)`;
  ctx.c1.firstChild.style.opacity = E.outCubic(p(lt, .7, .3));
  animWords(ctx.w1, lt, .8, .2, .4, null, 0, 16, 10);
  ctx.c2.firstChild.style.opacity = E.outCubic(p(lt, 2.65, .3)) * (1 - o);
  animWords(ctx.w2, lt, 2.75, .2, .4, ctx.dur - .55, .45, 16, 10);
  const nA = E.outQuint(p(lt, 3.75, .8));
  fadeBlur(ctx.notif, nA * (1 - o), (1 - nA) * 60, 12, lerp(.94, 1, nA));
  ctx.notif.querySelector('.ck').style.strokeDashoffset = 1 - E.inOutCubic(p(lt, 4.05, .4));
  const s0 = t - lt; cue('voiceUser', s0 + .8); cue('voiceBot', s0 + 2.75); cue('notif', s0 + 3.75);
}, { push: .012 });

/* =========================================================================
   LOGO: wordmark backspaces to "D", the D bursts into the brand's dots,
   the dots assemble into the DeCode mark.
   ========================================================================= */
const logoImg = new Image(); logoImg.src = LOGO_SRC;
addScene('logo', ctx => {
  const wm = el('div', 'wordmark', ctx.root); ctx.wm = wm;
  ctx.wmT = el('span', '', wm, 'DeCode');
  const r = rng(7);
  const S = .78;
  ctx.S = S;
  ctx.parts = window.LOGO_POINTS.map(([x, y]) => {
    const ang = r() * Math.PI * 2, rad = Math.sqrt(r());
    return {
      tx: 960 + x * S, ty: 540 + y * S,
      sx: 960 + Math.cos(ang) * rad * 46, sy: 540 + Math.sin(ang) * rad * 52,
      delay: r() * .3 + (Math.hypot(x, y) / 300) * .25,
      curl: (r() - .5) * 260,
      burst: [Math.cos(ang) * (60 + r() * 220), Math.sin(ang) * (60 + r() * 200)],
    };
  });
}, (lt, ctx, t) => {
  const word = 'DeCode';
  const inA = E.outCubic(p(lt, .05, .45));
  const del = Math.min(5, Math.floor(clamp((lt - .6) / .45) * 5.999));
  ctx.wmT.textContent = word.slice(0, 6 - del);
  const dOut = E.inCubic(p(lt, 1.05, .25));
  ctx.wm.style.opacity = inA * (1 - dOut);
  ctx.wm.style.filter = inA < .998 || dOut > 0 ? `blur(${(1 - inA) * 14 + dOut * 6}px)` : 'none';
  ctx.wm.style.transform = `translateY(${(1 - inA) * 30}px) scale(${1 + dOut * .15})`;
  // particles
  const fly0 = 1.08;
  cue('burst', t - lt + fly0); cue('logo', t - lt + 2.5);
  if (lt > fly0) {
    const solid = E.inOutCubic(p(lt, 2.3, .4));
    const fin = E.inOutCubic(p(lt, 2.5, .35));
    tx.fillStyle = '#f4f5f8';
    for (const q of ctx.parts) {
      const k = p(lt, fly0 + q.delay, .95);
      const e = E.inOutCubic(k);
      const b = Math.sin(Math.PI * Math.min(1, k * 1.25));
      const mx = lerp(q.sx, q.tx, e) + q.burst[0] * b * .9 + (-(q.ty - q.sy)) / 400 * q.curl * b * .3;
      const my = lerp(q.sy, q.ty, e) + q.burst[1] * b * .9;
      const s = lerp(3.4, 8.8, solid) + (1 - e) * 1.5;
      tx.globalAlpha = clamp(k * 6) * (1 - fin);
      tx.fillRect(mx - s / 2, my - s / 2, s, s);
    }
    tx.globalAlpha = 1;
    if (fin > 0 && logoImg.complete) {
      const sc = ctx.S * lerp(.985, 1, fin);
      tx.globalAlpha = fin;
      tx.drawImage(logoImg, 960 - 302.5 * sc, 540 - 194.5 * sc, 602 * sc, 410 * sc);
      tx.globalAlpha = 1;
    }
  }
}, { push: .02 });

/* final fade to black */
function finalFade(t) { $('fade').style.opacity = E.inOutCubic(p(t, DURATION - .55, .5)); }
const _seek = seek;
window.seek = t => { _seek(t); finalFade(t); };
window.DURATION = DURATION; window.FPS = FPS; window.TL = TL; window.CUES = CUES;
const shown = e => { const sc = e.closest('.scene'); return sc && sc.style.display !== 'none'; };
window.sfxState = () => ({
  typed: TYPED.reduce((a, e) => a + (shown(e) ? e.textContent.length : 0), 0),
  code: CODE_EL.reduce((a, e) => a + (shown(e) ? e.textContent.length : 0), 0),
});
const FONT_LOADS = ['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 40px Geist`)).concat(['400', '500'].map(w => document.fonts.load(`${w} 20px "Geist Mono"`)));
window.ready = Promise.all([...FONT_LOADS, document.fonts.ready, logoImg.decode().catch(() => {}), ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => { window.seek(0); return true; });

/* ---------- preview player ---------- */
function fit() {
  const s = Math.min(innerWidth / W, (innerHeight - (RENDER ? 0 : 44)) / H);
  stage.style.transform = RENDER ? 'none' : `scale(${s})`;
  stage.style.left = RENDER ? '0' : ((innerWidth - W * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();
if (!RENDER) {
  let playing = true, t0 = performance.now(), base = 0;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) base = +q.get('t');
  const scrub = $('scrub'), label = $('time'), btn = $('play');
  const cur = () => playing ? (base + (performance.now() - t0) / 1000) % DURATION : base;
  btn.onclick = () => { base = cur(); t0 = performance.now(); playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; };
  scrub.oninput = () => { base = scrub.value / 1000 * DURATION; t0 = performance.now(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.onclick(); } });
  window.ready.then(() => {
    const loop = () => { const t = cur(); window.seek(t); scrub.value = t / DURATION * 1000; label.textContent = t.toFixed(2) + 's / ' + DURATION.toFixed(1) + 's'; requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
