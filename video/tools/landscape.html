<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Landscape renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Procedural "mountain lake at sunrise" used as the generated image in the
// Image Generation scene. Raymarched terrain + water reflections + sky.
// Rendered once in strips (to stay under GPU watchdog limits) and saved as PNG.
const FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec4 uTile;
out vec4 fragColor;

const mat2 m2 = mat2(0.8,-0.6,0.6,0.8);
const vec3 SUN = normalize(vec3(-0.40, 0.085, 0.91));

float hash(vec2 p){ p = 50.0*fract(p*0.3183099 + vec2(0.71,0.113)); return -1.0+2.0*fract(p.x*p.y*(p.x+p.y)); }

vec3 noised(vec2 x){
  vec2 i = floor(x); vec2 f = fract(x);
  vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
  vec2 du = 30.0*f*f*(f*(f-2.0)+1.0);
  float a = hash(i+vec2(0,0)), b = hash(i+vec2(1,0));
  float c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
  float k0=a, k1=b-a, k2=c-a, k4=a-b-c+d;
  return vec3(k0 + k1*u.x + k2*u.y + k4*u.x*u.y, du*vec2(k1 + k4*u.y, k2 + k4*u.x));
}
float noise(vec2 x){ return noised(x).x; }

float fbm(vec2 p, int oct){
  float f = 0.0, s = 0.5;
  for(int i=0;i<12;i++){ if(i>=oct) break; f += s*noise(p); s *= 0.5; p = m2*p*2.02; }
  return f;
}

// eroded-looking terrain (derivative damped fbm)
float terr(vec2 x, int oct){
  vec2 p = x*0.0016;
  float a = 0.0, b = 1.0; vec2 d = vec2(0.0);
  for(int i=0;i<16;i++){
    if(i>=oct) break;
    vec3 n = noised(p);
    d += n.yz;
    a += b*n.x/(1.0+dot(d,d));
    b *= 0.5; p = m2*p*2.0;
  }
  return a;
}

float height(vec2 xz, int oct){
  float z = xz.y, x = xz.x;
  float base = terr(xz + vec2(310.0, 90.0), oct);
  // main range far away, rising with distance
  float range = smoothstep(520.0, 1900.0, z + 0.22*abs(x));
  float peaks = 560.0*range*(0.55 + 0.85*base) + 220.0*range*range;
  // forested foothills/shores on the sides and across the lake
  float side = smoothstep(220.0, 620.0, abs(x - 40.0) + 0.0*z) * smoothstep(-50.0, 260.0, z);
  float across = smoothstep(330.0, 520.0, z);
  float hills = (side*95.0 + across*70.0)*(0.55 + 0.6*base);
  float h = max(peaks, hills) + 18.0*base - 26.0;
  h *= 1.0 - 0.75*smoothstep(3200.0, 5200.0, z);
  return h;
}

float terrainL(vec2 p){ return height(p, 5); }
float terrainM(vec2 p){ return height(p, 9); }
float terrainH(vec2 p){ return height(p, 14); }

float raymarchTerrain(vec3 ro, vec3 rd, float tmin, float tmax){
  float t = tmin;
  for(int i=0;i<320;i++){
    vec3 p = ro + t*rd;
    float h = p.y - terrainM(p.xz);
    if(abs(h) < 0.0015*t || t > tmax) break;
    t += 0.45*h;
  }
  return t;
}

float softShadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 2.0;
  for(int i=0;i<64;i++){
    vec3 p = ro + t*rd;
    float h = p.y - terrainL(p.xz);
    res = min(res, 14.0*h/t);
    t += clamp(h, 4.0, 60.0);
    if(res < 0.001 || p.y > 900.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 calcNormal(vec3 pos, float t){
  vec2 e = vec2(0.0018*t + 0.05, 0.0);
  return normalize(vec3(terrainH(pos.xz-e.xy) - terrainH(pos.xz+e.xy), 2.0*e.x,
                        terrainH(pos.xz-e.yx) - terrainH(pos.xz+e.yx)));
}

vec3 skyColor(vec3 rd){
  float sd = max(dot(rd, SUN), 0.0);
  float y = max(rd.y, 0.0);
  vec3 zen = vec3(0.07, 0.17, 0.42);
  vec3 hor = vec3(1.0, 0.60, 0.36);
  vec3 col = mix(hor, zen, pow(y, 0.42));
  // warm band around the sun near the horizon
  col += vec3(1.0, 0.45, 0.16)*0.95*pow(sd, 4.0)*exp(-4.0*y);
  col += vec3(1.0, 0.72, 0.42)*0.35*pow(sd, 32.0);
  col += vec3(1.0, 0.85, 0.65)*1.6*pow(sd, 900.0);
  // clouds on a plane
  if(rd.y > 0.0){
    float tc = (1400.0)/rd.y;
    vec2 uv = (rd.xz*tc)*0.00042 + vec2(0.3, 1.7);
    float n = fbm(uv*vec2(1.0, 2.6) + 0.35*fbm(uv*3.1, 5), 7);
    float c = smoothstep(-0.05, 0.42, n);
    float fade = smoothstep(0.0, 0.12, rd.y)*(1.0 - smoothstep(0.35, 0.9, rd.y)*0.6);
    vec3 cc = mix(vec3(0.98, 0.58, 0.48), vec3(1.0, 0.86, 0.72), pow(sd, 3.0));
    cc = mix(cc, vec3(0.55, 0.52, 0.66), smoothstep(0.25, 0.8, rd.y)*0.6);
    col = mix(col, cc, 0.72*c*fade);
  }
  return col;
}

vec3 fogApply(vec3 col, float t, vec3 rd){
  float sd = max(dot(rd, SUN), 0.0);
  vec3 fogc = mix(vec3(0.42, 0.50, 0.68), vec3(1.0, 0.66, 0.42), pow(sd, 5.0));
  float f = 1.0 - exp(-0.00016*t);
  return mix(col, fogc, f);
}

vec3 shadeTerrain(vec3 pos, vec3 rd, float t){
  vec3 nor = calcNormal(pos, t);
  float hh = pos.y;
  float slope = nor.y;
  float r = noise(pos.xz*0.07);
  // base materials
  vec3 rock = mix(vec3(0.20, 0.17, 0.15), vec3(0.32, 0.29, 0.27), r*0.5+0.5);
  vec3 forest = vec3(0.045, 0.075, 0.045)*(0.8 + 0.4*noise(pos.xz*0.35));
  float fo = smoothstep(0.62, 0.86, slope)*(1.0 - smoothstep(110.0, 230.0, hh + 30.0*r));
  vec3 col = mix(rock, forest, fo);
  // snow on high ground, more on flatter faces
  float sn = smoothstep(330.0, 420.0, hh + 60.0*fbm(pos.xz*0.012, 4)) * smoothstep(0.35, 0.75, slope + 0.25*r);
  col = mix(col, vec3(0.80, 0.83, 0.90), sn);

  float dif = clamp(dot(nor, SUN), 0.0, 1.0);
  float sha = dif > 0.001 ? softShadow(pos + nor*1.0, SUN) : 0.0;
  float amb = clamp(0.5 + 0.5*nor.y, 0.0, 1.0);
  float bac = clamp(dot(normalize(vec3(-SUN.x, 0.0, -SUN.z)), nor), 0.0, 1.0);

  vec3 lin = vec3(0.0);
  lin += dif*vec3(3.6, 1.75, 0.85)*vec3(sha, sha*sha*0.6+0.4*sha, sha*sha*sha*0.5+0.5*sha*sha);
  lin += amb*vec3(0.16, 0.22, 0.36);
  lin += bac*vec3(0.18, 0.14, 0.12);
  col *= lin;
  // alpenglow on snow
  col += sn*dif*sha*vec3(0.55, 0.16, 0.08);
  return fogApply(col, t, rd);
}

vec3 render(vec3 ro, vec3 rd){
  float tmax = 9000.0;
  // water plane at y = 0
  float tw = rd.y < 0.0 ? -ro.y/rd.y : 1e9;
  float tt = raymarchTerrain(ro, rd, 1.0, min(tmax, tw));
  if(tt < min(tw, tmax)){
    vec3 pos = ro + tt*rd;
    return shadeTerrain(pos, rd, tt);
  }
  if(tw < tmax){
    vec3 pos = ro + tw*rd;
    // gentle ripples, stronger close to camera
    vec2 q = pos.xz;
    vec3 n1 = noised(q*vec2(0.06, 0.22));
    vec3 n2 = noised(q*vec2(0.15, 0.6) + 4.0);
    float amp = 0.007*exp(-tw*0.006) + 0.0018;
    vec3 nor = normalize(vec3(-(n1.y*0.6+n2.y*0.4)*amp*0.35, 1.0, -(n1.z*0.6+n2.z*0.4)*amp));
    vec3 rr = reflect(rd, nor);
    float fre = 0.02 + 0.98*pow(1.0 - clamp(dot(-rd, nor), 0.0, 1.0), 5.0);
    vec3 refl;
    float tr = raymarchTerrain(pos + nor*0.5, rr, 2.0, tmax);
    if(tr < tmax){ refl = shadeTerrain(pos + tr*rr, rr, tr + tw); }
    else { refl = skyColor(rr); }
    vec3 deep = vec3(0.01, 0.03, 0.04);
    vec3 col = mix(deep, refl*0.92, clamp(fre*1.15 + 0.12, 0.0, 1.0));
    // sun glitter path
    // glitter: a rougher normal spreads the sun into a vertical sparkle path
    vec3 g1 = noised(q*vec2(0.9, 2.8) + 11.0);
    vec3 g2 = noised(q*vec2(2.1, 6.0) - 7.0);
    vec3 ng = normalize(vec3(-(g1.y + 0.6*g2.y)*0.05, 1.0, -(g1.z + 0.6*g2.z)*0.11));
    float sp = pow(clamp(dot(reflect(rd, ng), SUN), 0.0, 1.0), 900.0);
    col += vec3(1.0, 0.74, 0.46)*sp*2.2;
    col += vec3(1.0, 0.62, 0.36)*0.22*pow(clamp(dot(rr, SUN), 0.0, 1.0), 60.0);
    return fogApply(col, tw, rd);
  }
  return skyColor(rd);
}

void main(){
  vec2 frag = gl_FragCoord.xy + uTile.xy;
  vec2 p = (2.0*frag - uRes)/uRes.y;
  vec3 ro = vec3(-40.0, 7.0, -160.0);
  vec3 ta = vec3(-90.0, 150.0, 900.0);
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(ww, vec3(0,1,0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(p.x*uu + p.y*vv + 1.85*ww);
  vec3 col = render(ro, rd);
  // tone map (ACES approx) + grade
  col = col*0.80;
  col = (col*(2.51*col + 0.03))/(col*(2.43*col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2));
  col = col*col*(3.0 - 2.0*col)*0.25 + col*0.75;
  vec2 q = frag/uRes;
  col *= 0.55 + 0.45*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.12);
  fragColor = vec4(col, 1.0);
}`;

const VERT = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

window.renderLandscape = async function (W, H, strip) {
  const c = document.getElementById('c');
  c.width = W; c.height = strip;
  const gl = c.getContext('webgl2', { preserveDrawingBuffer: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), W, H);
  const uTile = gl.getUniformLocation(prog, 'uTile');
  const strips = [];
  for (let y = 0; y < H; y += strip) {
    gl.uniform4f(uTile, 0, y, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    const px = new Uint8Array(W * strip * 4);
    gl.readPixels(0, 0, W, strip, gl.RGBA, gl.UNSIGNED_BYTE, px);
    // raw RGBA rows, bottom-up, returned as base64
    let s = ''; const CH = 0x8000;
    for (let i = 0; i < px.length; i += CH) s += String.fromCharCode.apply(null, px.subarray(i, i + CH));
    strips.push(btoa(s));
    await new Promise(r => setTimeout(r, 0));
  }
  return strips;
};
</script>
</body>
</html>
